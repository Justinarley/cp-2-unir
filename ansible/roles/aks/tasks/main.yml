# === AKS Deployment Steps ===
# Este archivo contiene las tareas para desplegar la solución en Kubernetes (AKS).
# Incluye backend (Redis), frontend (azure-vote-front), almacenamiento y acceso externo.
# Cada paso está automatizado y documentado para claridad.
# ============================
---
# ---
# Paso 1: Crear un namespace para agrupar los recursos de la app
- name: "AKS | Crear namespace {{ app_namespace }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ playbook_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ app_namespace }}"

# ---
# Paso 2: Crear un secreto con las credenciales del ACR para el acceso de los pods
- name: "AKS | Crear secret de acceso al ACR"
  kubernetes.core.k8s:
    kubeconfig: "{{ playbook_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: acr-secret
        namespace: "{{ app_namespace }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ {'auths': {acr_login_server: {'username': acr_username, 'password': acr_password, 'auth': (acr_username + ':' + acr_password) | b64encode}}} | to_json | b64encode }}"

# ---
# Paso 3: Crear un PersistentVolumeClaim para Redis (datos persistentes)
- name: "AKS | Crear PersistentVolumeClaim para Redis"
  kubernetes.core.k8s:
    kubeconfig: "{{ playbook_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: redis-pvc
        namespace: "{{ app_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce # Permite escritura exclusiva a un pod
        resources:
          requests:
            storage: 1Gi # Espacio reservado para Redis

# ---
# Paso 4: Desplegar el backend Redis (almacena los votos)
- name: "AKS | Desplegar backend Redis"
  kubernetes.core.k8s:
    kubeconfig: "{{ playbook_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: "{{ app_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: backend
        template:
          metadata:
            labels:
              app: backend
          spec:
            imagePullSecrets:
              - name: acr-secret # Se utiliza el secret creado en el paso 2
            containers:
              - name: backend
                image: "{{ acr_login_server }}/redis:6.0.8"
                env:
                  - name: ALLOW_EMPTY_PASSWORD
                    value: "yes"
                ports:
                  - containerPort: 6379
                    name: redis
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "250m"
                    memory: "256Mi"
                volumeMounts:
                  - name: redis-data
                    mountPath: /data # Carpeta de datos persistentes de Redis
            volumes:
              - name: redis-data
                persistentVolumeClaim:
                  claimName: redis-pvc # Referencia al volumen persistente

# ---
# Paso 5: Crear un servicio interno (ClusterIP) para Redis
- name: "AKS | Crear Service para el backend Redis"
  kubernetes.core.k8s:
    kubeconfig: "{{ playbook_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        namespace: "{{ app_namespace }}"
      spec:
        ports:
          - port: 6379
        selector:
          app: backend

# ---
# Paso 6: Desplegar el frontend (aplicación web de votación)
- name: "AKS | Desplegar frontend azure-vote-front"
  kubernetes.core.k8s:
    kubeconfig: "{{ playbook_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
        namespace: "{{ app_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: frontend
        template:
          metadata:
            labels:
              app: frontend
          spec:
            nodeSelector:
              kubernetes.io/os: linux
            imagePullSecrets:
              - name: acr-secret
            containers:
              - name: frontend
                image: "{{ acr_login_server }}/azure-vote-front:v1"
                ports:
                  - containerPort: 80
                env:
                  - name: REDIS
                    value: "backend" # Apunta al servicio interno de Redis
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "250m"
                    memory: "256Mi"

# ---
# Paso 7: Crear un servicio LoadBalancer para exponer el frontend a Internet
- name: "AKS | Crear Service LoadBalancer para el frontend"
  kubernetes.core.k8s:
    kubeconfig: "{{ playbook_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend
        namespace: "{{ app_namespace }}"
      spec:
        type: LoadBalancer # Asigna una IP pública en Azure
        ports:
          - port: 80
        selector:
          app: frontend

# ---
# Paso 8: Esperar la IP pública y mostrar la URL de acceso
- name: "AKS | Esperar a que el LoadBalancer obtenga IP pública (puede tardar 2 min)"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ playbook_dir }}/kubeconfig"
    kind: Service
    name: frontend
    namespace: "{{ app_namespace }}"
  register: frontend_service
  until: frontend_service.resources[0].status.loadBalancer.ingress is defined
  retries: 20
  delay: 15

- name: "AKS | IP pública de la aplicación"
  ansible.builtin.debug:
    msg: "✅ Aplicación disponible en: http://{{ frontend_service.resources[0].status.loadBalancer.ingress[0].ip }}"
